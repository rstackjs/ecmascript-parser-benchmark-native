[package]
name = "rust_parsers"
version = "0.1.0"
edition = "2024"

[dependencies]
oxc_allocator = "0.158.0"
oxc_ast = { version = "0.158.0", features = ["serialize"] }
oxc_ast_visit = "0.158.0"
oxc_parser = "0.158.0"
oxc_semantic = "0.158.0"
oxc_span = "0.158.0"

swc_ecma_parser = { version = "47.0.0", features = ["typescript"] }
swc_common = "27.0.0"
swc_ecma_ast = { version = "30.0.0", features = ["serde-impl"] }
serde_json = "1.0"

swc_next_allocator = "=0.6.1"
swc_next_ecma_ast = "=0.6.1"
swc_next_ecma_parser = "=0.6.1"
swc_next_ecma_semantic = "=0.6.1"

mimalloc = { package = "mimalloc-safe", version = "0.1.52" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
debug         = false
panic         = "abort"
